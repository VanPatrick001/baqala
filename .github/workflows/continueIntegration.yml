name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck -w @baqala/backend

      - name: Build test ci
        run: npm run build -w @baqala/backend

      - name: Tests
        run: npm test -w @baqala/backend