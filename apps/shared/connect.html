<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BAQALA</title>
<!--
  Écran de connexion au serveur, commun aux applications PC (Electron) et Android.
  L'application hôte fournit window.BaqalaSetup :
    platform        'desktop' | 'android'
    getConfig()     -> JSON (chaîne ou promesse)  { serverUrl, receiptPrinter, kiosk, autoStart, lang }
    checkServer(u)  -> 'ok' | 'notBaqala' | 'unreachable'   (Android ; sinon test par fetch)
    listPrinters()  -> promesse [{ name, isDefault }]   (PC uniquement)
    connect(json)   enregistre la configuration et ouvre le serveur
-->
<style>
  :root { --brand: #0f766e; --brand-dark: #115e59; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1; --bg: #f1f5f9; --card: #fff; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e2e8f0; --muted: #94a3b8; --line: #334155; --bg: #0b1220; --card: #111827; --err: #f87171; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Naskh Arabic', Tahoma, sans-serif; touch-action: manipulation; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; min-height: 100vh; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; box-shadow: 0 10px 30px rgb(15 23 42 / .08); }
  .head { text-align: center; margin-bottom: 20px; }
  .head img { width: 72px; height: 72px; }
  h1 { margin: 8px 0 2px; font-size: 26px; letter-spacing: .06em; color: var(--brand); }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .langs { display: flex; justify-content: center; gap: 6px; margin: 14px 0 6px; }
  .langs button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
  input[type=url], input[type=text], select { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; background: transparent; color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .ltr { direction: ltr; text-align: left; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .check { display: flex; align-items: center; gap: 10px; font-weight: 500; margin: 12px 0 0; }
  .check input { width: 20px; height: 20px; accent-color: var(--brand); }
  .btn { width: 100%; min-height: 52px; margin-top: 22px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
  .btn:active { background: var(--brand-dark); }
  .btn[disabled] { opacity: .6; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: none; }
  .msg.err { display: block; color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent); }
  .msg.ok { display: block; color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
  .desktop-only { display: none; }
  body.desktop .desktop-only { display: block; }
  details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <img src="icon.svg" alt="" />
    <h1>BAQALA</h1>
    <p class="sub" data-t="subtitle"></p>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en" lang="en">English</button>
      <button data-lang="ur" lang="ur">اردو</button>
      <button data-lang="ar" lang="ar">العربية</button>
    </div>
  </div>

  <form id="form" novalidate>
    <label for="url" data-t="server"></label>
    <input id="url" class="ltr" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.20:4000" required />
    <div class="hint" data-t="serverHint"></div>

    <details class="desktop-only" id="opts">
      <summary data-t="options"></summary>
      <label for="printer" data-t="printer"></label>
      <select id="printer"><option value="" data-t="printerDialog"></option></select>
      <div class="hint" data-t="printerHint"></div>
      <label class="check"><input id="kiosk" type="checkbox" /> <span data-t="kiosk"></span></label>
      <label class="check"><input id="autostart" type="checkbox" /> <span data-t="autostart"></span></label>
    </details>

    <button class="btn" id="go" type="submit" data-t="connect"></button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</main>

<script>
const T = {
  en: {
    subtitle: 'Connect to your shop server', server: 'Server address',
    serverHint: 'In the shop: http://192.168.1.20:4000 (address shown by the server). Remotely: your Tailscale address, e.g. http://shop-pc:4000.',
    options: 'Options for this PC', printer: 'Receipt printer', printerDialog: 'Ask every time (print dialog)',
    printerHint: 'Receipts are printed straight to this printer, without a dialog.',
    kiosk: 'Full screen (kiosk) — Alt+F4 to quit', autostart: 'Open BAQALA when Windows starts',
    connect: 'Connect', testing: 'Checking the server…', ok: 'Connected. Opening BAQALA…',
    invalid: 'Enter an address starting with http:// or https://',
    unreachable: 'The server does not answer. Check the address, that the shop PC is on, and (remotely) that Tailscale is connected.',
    notBaqala: 'A server answered but it is not BAQALA. Check the address and port.',
    lost: 'Connection to the server lost. Retrying…',
  },
  ur: {
    subtitle: 'اپنی دکان کے سرور سے جڑیں', server: 'سرور کا پتہ',
    serverHint: 'دکان میں: http://192.168.1.20:4000 (سرور پر دکھایا گیا پتہ)۔ دور سے: آپ کا Tailscale پتہ، مثلاً http://shop-pc:4000۔',
    options: 'اس کمپیوٹر کی ترتیبات', printer: 'رسید پرنٹر', printerDialog: 'ہر بار پوچھیں (پرنٹ ونڈو)',
    printerHint: 'رسیدیں بغیر کسی ونڈو کے سیدھی اس پرنٹر پر پرنٹ ہوں گی۔',
    kiosk: 'مکمل اسکرین (کیوسک) — بند کرنے کے لیے Alt+F4', autostart: 'ونڈوز شروع ہونے پر BAQALA کھولیں',
    connect: 'جڑیں', testing: 'سرور چیک ہو رہا ہے…', ok: 'جڑ گیا۔ BAQALA کھل رہا ہے…',
    invalid: 'ایسا پتہ درج کریں جو http:// یا https:// سے شروع ہو',
    unreachable: 'سرور جواب نہیں دے رہا۔ پتہ چیک کریں، دکان کا کمپیوٹر آن ہو، اور (دور سے) Tailscale جڑا ہو۔',
    notBaqala: 'ایک سرور نے جواب دیا مگر وہ BAQALA نہیں ہے۔ پتہ اور پورٹ چیک کریں۔',
    lost: 'سرور سے رابطہ منقطع۔ دوبارہ کوشش ہو رہی ہے…',
  },
  ar: {
    subtitle: 'اتصل بخادم متجرك', server: 'عنوان الخادم',
    serverHint: 'داخل المتجر: http://192.168.1.20:4000 (العنوان الذي يعرضه الخادم). عن بُعد: عنوان Tailscale، مثل http://shop-pc:4000.',
    options: 'خيارات هذا الحاسوب', printer: 'طابعة الإيصالات', printerDialog: 'السؤال في كل مرة (نافذة الطباعة)',
    printerHint: 'تُطبع الإيصالات مباشرة على هذه الطابعة دون نافذة.',
    kiosk: 'ملء الشاشة (كشك) — Alt+F4 للخروج', autostart: 'فتح BAQALA عند تشغيل ويندوز',
    connect: 'اتصال', testing: 'جارٍ التحقق من الخادم…', ok: 'تم الاتصال. جارٍ فتح BAQALA…',
    invalid: 'أدخل عنوانًا يبدأ بـ http:// أو https://',
    unreachable: 'الخادم لا يستجيب. تحقق من العنوان ومن تشغيل حاسوب المتجر و(عن بُعد) من اتصال Tailscale.',
    notBaqala: 'استجاب خادم لكنه ليس BAQALA. تحقق من العنوان والمنفذ.',
    lost: 'انقطع الاتصال بالخادم. جارٍ إعادة المحاولة…',
  },
};

const host = window.BaqalaSetup || { platform: 'desktop', getConfig: () => '{}', connect: (c) => { location.href = JSON.parse(c).serverUrl; } };
const platform = typeof host.platform === 'function' ? host.platform() : host.platform;
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let lang = 'en';
let config = {};

function setLang(l) {
  lang = T[l] ? l : 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  try { localStorage.setItem('baqala.lang', lang); } catch (e) {}
}

function show(kind, key) {
  const m = $('msg');
  m.className = 'msg ' + kind;
  m.textContent = key ? T[lang][key] : '';
}

function normalize(raw) {
  let u = (raw || '').trim().replace(/\/+$/, '');
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
  try { const p = new URL(u); return p.protocol.startsWith('http') ? p.origin : null; } catch (e) { return null; }
}

async function check(url) {
  if (host.checkServer) return host.checkServer(url);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch(url + '/api/health', { signal: ctrl.signal, cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    return j.app === 'baqala' ? 'ok' : 'notBaqala';
  } catch (e) {
    return 'unreachable';
  } finally { clearTimeout(timer); }
}

async function connect(url) {
  $('go').disabled = true;
  show('ok', 'testing');
  const res = await check(url);
  $('go').disabled = false;
  if (res !== 'ok') { show('err', res); return false; }
  show('ok', 'ok');
  const out = Object.assign({}, config, {
    serverUrl: url, lang,
    receiptPrinter: $('printer').value || null,
    kiosk: $('kiosk').checked, autoStart: $('autostart').checked,
  });
  host.connect(JSON.stringify(out));
  return true;
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const url = normalize($('url').value);
  if (!url) { show('err', 'invalid'); return; }
  $('url').value = url;
  connect(url);
});
document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

(async function init() {
  const raw = await Promise.resolve(host.getConfig());
  config = typeof raw === 'string' ? JSON.parse(raw || '{}') : (raw || {});
  let saved = null;
  try { saved = localStorage.getItem('baqala.lang'); } catch (e) {}
  setLang(config.lang || saved || (navigator.language || 'en').slice(0, 2));
  if (platform === 'desktop') document.body.classList.add('desktop');
  $('url').value = config.serverUrl || (platform === 'desktop' ? 'http://localhost:4000' : '');
  $('kiosk').checked = !!config.kiosk;
  $('autostart').checked = !!config.autoStart;
  if (host.listPrinters) {
    const printers = await Promise.resolve(host.listPrinters()).catch(() => []);
    for (const p of printers || []) {
      const o = document.createElement('option');
      o.value = p.name; o.textContent = p.name + (p.isDefault ? ' ★' : '');
      $('printer').appendChild(o);
    }
    $('printer').value = config.receiptPrinter || '';
  }
  // Serveur perdu : on réessaie tout seul toutes les 5 s
  if (params.get('reason') === 'offline' && config.serverUrl) {
    show('err', 'lost');
    const retry = async () => { if (await check(config.serverUrl) === 'ok') connect(config.serverUrl); else setTimeout(retry, 5000); };
    setTimeout(retry, 3000);
  }
})();
</script>
</body>
</html>
